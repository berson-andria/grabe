[package]
name = "grabe-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
grabe-events     = { workspace = true }
grabe-watcher    = { workspace = true }
grabe-analyzer   = { workspace = true }
grabe-nlp        = { workspace = true }
grabe-correlator = { workspace = true }
grabe-sandbox    = { workspace = true }
grabe-policy     = { workspace = true }
grabe-logger     = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }
[target.'cfg(target_os = "linux")'.dependencies]
grabe-interceptor-linux = { workspace = true }
nix = { workspace = true }
[target.'cfg(windows)'.dependencies]
grabe-interceptor-win = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Console"] }